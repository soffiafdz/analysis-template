title: Analysis reports and slides
author: Sofía Fernández
version: 2026.11.0
quarto-required: ">=1.9.0"
# The formats of the analysis project template (GUIDE.md section 8,
# docs/STYLE.md). A document declares one of them and nothing else:
# analysis-revealjs, analysis-pdf or analysis-pptx. Installed from the
# template's extension/ with quarto add; updated with quarto update.
contributes:
  formats:
    # The designed deck: self-contained HTML in the slide theme
    revealjs:
      embed-resources: true
      theme: [default, slides.scss]
      menu: false
      width: 1600
      height: 900
      margin: 0.06
      # Each slide is a flex column (slides.scss); figures are drawn at
      # their area's size, so reveal must not stretch them; the running
      # line carries the slide number, set by slides-footer.html
      display: flex
      auto-stretch: false
      slide-number: false
      progress: false
      include-after-body: slides-footer.html
      # IBM Plex Sans, embedded from fonts/
      css: fonts/plex.css
    # Reports
    pdf:
      pdf-engine: xelatex
      toc: true
      toc-depth: 2
      number-sections: true
      geometry: margin=2.2cm
      # EB Garamond for the text, TeX Gyre Heros (a free Helvetica) for
      # headings and figures, chosen from rendered specimens (docs/STYLE.md).
      # Both are free, ship with TeX Live and have the Greek reports need
      # (APOE ε4, η²), so a report renders the same on any machine
      fontsize: 11.5pt
      mainfont: EBGaramond
      mainfontoptions:
        - Extension=.otf
        - UprightFont=*-Regular
        - ItalicFont=*-Italic
        - BoldFont=*-SemiBold
        - BoldItalicFont=*-SemiBoldItalic
      sansfont: texgyreheros
      sansfontoptions:
        - Extension=.otf
        - UprightFont=*-regular
        - ItalicFont=*-italic
        - BoldFont=*-bold
        - BoldItalicFont=*-bolditalic
    # The editable copy of a deck, on the template slides-reference.pptx
    pptx:
      reference-doc: slides-reference.pptx
