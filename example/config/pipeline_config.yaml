# =============================================================================
# Pipeline configuration: every path and analysis parameter lives here
# =============================================================================

general:
  project_name: penguins_example
  random_seed: 1618

# Every input and output file, relative to the project root.
data:
  # The data ship with R (datasets::penguins); there is no input file
  inputs: {}
  derivatives:
    penguins: data/derivatives/penguins.rds
  models:
    body_mass: models/results/body_mass.rds
  outputs:
    # PNG: ragg draws it in the documents' face, TeX Gyre Heros
    body_mass_figure: outputs/figures/body_mass.png
    body_mass_slide: outputs/figures/body_mass_slide.png
    sample_slide: outputs/figures/sample_slide.png
    differences_slide: outputs/figures/differences_slide.png
    summary_env: outputs/summary_env.rds

# Levels and units per ?datasets::penguins (R 4.6.1)
parameters:
  columns: [species, island, bill_len, bill_dep, flipper_len, body_mass,
            sex, year]
  species: [Adelie, Chinstrap, Gentoo]
  islands: [Biscoe, Dream, Torgersen]
  sexes: [female, male]
  sex_labels: [Female, Male]
  years: [2007, 2008, 2009]
  measurements: [bill_len, bill_dep, flipper_len, body_mass]
  ci_level: 0.95

output:
  figure_size: [7, 4]
  # Species, from tol_bright; red is left out because it is too close to
  # the McGill red of the slides (docs/STYLE.md)
  colors:
    adelie: "#4477AA"
    chinstrap: "#228833"
    gentoo: "#AA3377"
  # Slide versions of figures, PNG only: no title or caption (the slide
  # heading carries them). Each is drawn at the size of the area it fills on
  # the 1600 x 900 px slide (inches at slide_dpi, shown at one image pixel
  # per slide pixel), in IBM Plex Sans at slide_text_px (the size of the
  # slide captions), so figure and slide type match. Areas: full width and
  # the wider column of the two column layouts (the extension's slides.scss)
  slide_dpi: 200
  slide_text_px: 30
  slide_areas:
    full: [8, 3.0]
    columns_7: [4.52, 3.0]

scripts:
  # One flag per script with a cache check; set true to re-run, then back
  force_regenerate:
    prepare_penguins: false
    compare_body_mass: false
    build_summary_env: false
